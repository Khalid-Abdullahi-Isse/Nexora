name: social-media-backend

x-service-env: &service-env
  APP_ENV: development
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: app_auth
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/setup-security-dev.py}
  POSTGRES_DB: social_media
  POSTGRES_SSLMODE: disable
  REDIS_ADDR: redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0
  NOTIFICATION_STREAM: ${NOTIFICATION_STREAM:-events:notifications}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_GLOBAL_REQUESTS: ${RATE_LIMIT_GLOBAL_REQUESTS:-100}
  RATE_LIMIT_GLOBAL_WINDOW: ${RATE_LIMIT_GLOBAL_WINDOW:-1m}
  RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-3}
  RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-10m}
  RATE_LIMIT_WEBSOCKET_REQUESTS: ${RATE_LIMIT_WEBSOCKET_REQUESTS:-10}
  RATE_LIMIT_WEBSOCKET_WINDOW: ${RATE_LIMIT_WEBSOCKET_WINDOW:-1m}
  RATE_LIMIT_REDIS_TIMEOUT: ${RATE_LIMIT_REDIS_TIMEOUT:-200ms}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.80.2/32}
  JWT_PUBLIC_KEYS_FILE: /keys/public-keys.json
  JWT_ISSUER: ${JWT_ISSUER:-social-media-auth}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  AUTH_COOKIE_INSECURE: "true"

services:
  kong-gateway:
    image: kong:3.9.1
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PREFIX: /tmp/kong
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      # Docker publishes this only on the host loopback interface.
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout gateway"
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: warn
      KONG_HEADERS: "off"
      KONG_TRUSTED_IPS: ""
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 8k"
      KONG_NGINX_HTTP_LOG_FORMAT: >-
        gateway escape=json '{"method":"$$request_method","path":"$$uri","status":$$status,"upstream":"$$upstream_addr","duration":$$request_time,"request_id":"$$http_x_request_id"}'
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      gateway-network:
        ipv4_address: 172.30.80.2
    healthcheck:
      test: ["CMD", "kong", "health", "-p", "/tmp/kong"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: social-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Migration password required}
      POSTGRES_DB: social_media
      AUTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Auth database password required}
      POST_DATABASE_PASSWORD: ${POST_DATABASE_PASSWORD:?Post database password required}
      CHAT_DATABASE_PASSWORD: ${CHAT_DATABASE_PASSWORD:?Chat database password required}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:?Notification database password required}
    ports:
      # Host 5432 is already occupied in this environment; PostgreSQL remains
      # on its standard container port 5432 and is exposed locally on 15432.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-runtime-roles.sh:ro
    networks: [social-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: social-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password required}
    command: ["sh", "-c", 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [social-network]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Migration password required}
      POSTGRES_DB: social_media
      POSTGRES_SSLMODE: disable
    volumes:
      - ../services/auth-service/migrations:/app/services/auth-service/migrations:ro
      - ./migrations/legacy-user:/app/docker/migrations/legacy-user:ro
      - ../services/post-service/migrations:/app/services/post-service/migrations:ro
      - ../services/chat-service/migrations:/app/services/chat-service/migrations:ro
      - ../services/notification-service/migrations:/app/services/notification-service/migrations:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [social-network]

  auth-service:
    build:
      context: ..
      dockerfile: docker/auth-service.Dockerfile
    container_name: social-auth
    environment:
      <<: *service-env
      AUTH_SERVICE_PORT: 8001
      JWT_PRIVATE_KEY_FILE: /keys/private.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-development-1}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../.secrets/public-keys.json:/keys/public-keys.json:ro
      - ../.secrets/private.pem:/keys/private.pem:ro
    expose: ["8001"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [social-network, gateway-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  post-service:
    build:
      context: ..
      dockerfile: docker/post-service.Dockerfile
    container_name: social-post
    environment:
      <<: *service-env
      POST_SERVICE_PORT: 8003
      POSTGRES_USER: app_post
      POSTGRES_PASSWORD: ${POST_DATABASE_PASSWORD:?Runtime password required}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../.secrets/public-keys.json:/keys/public-keys.json:ro
    expose: ["8003"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [social-network, gateway-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8003/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-service:
    build:
      context: ..
      dockerfile: docker/chat-service.Dockerfile
    container_name: social-chat
    environment:
      <<: *service-env
      CHAT_SERVICE_PORT: 8004
      WS_MAX_MESSAGE_SIZE: ${WS_MAX_MESSAGE_SIZE:-16384}
      CHAT_MESSAGE_MAX_LENGTH: ${CHAT_MESSAGE_MAX_LENGTH:-4096}
      WS_SEND_QUEUE: ${WS_SEND_QUEUE:-64}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-8}
      WS_WRITE_TIMEOUT: ${WS_WRITE_TIMEOUT:-10s}
      WS_READ_TIMEOUT: ${WS_READ_TIMEOUT:-60s}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25s}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-120}
      POSTGRES_USER: app_chat
      POSTGRES_PASSWORD: ${CHAT_DATABASE_PASSWORD:?Runtime password required}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../.secrets/public-keys.json:/keys/public-keys.json:ro
    expose: ["8004"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [social-network, gateway-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8004/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: ..
      dockerfile: docker/notification-service.Dockerfile
    container_name: social-notification
    environment:
      <<: *service-env
      NOTIFICATION_SERVICE_PORT: 8005
      NOTIFICATION_CONSUMER_GROUP: ${NOTIFICATION_CONSUMER_GROUP:-notification-service}
      NOTIFICATION_RETRY_IDLE: ${NOTIFICATION_RETRY_IDLE:-30s}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-10}
      NOTIFICATION_PAGE_SIZE: ${NOTIFICATION_PAGE_SIZE:-30}
      WS_SEND_QUEUE: ${WS_SEND_QUEUE:-64}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-8}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25s}
      WS_PONG_TIMEOUT: ${WS_PONG_TIMEOUT:-60s}
      WS_WRITE_TIMEOUT: ${WS_WRITE_TIMEOUT:-5s}
      POSTGRES_USER: app_notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:?Runtime password required}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../.secrets/public-keys.json:/keys/public-keys.json:ro
    expose: ["8005"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [social-network, gateway-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8005/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: social-media-backend_postgres_data
  redis_data:
    name: social-media-backend_redis_data

networks:
  social-network:
    name: social-network
    driver: bridge
  gateway-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24
