{{- if .Values.secrets.create }}
{{- if ne .Values.global.environment "development" }}
{{- fail "Inline secrets are allowed only in development. Provision an existing Secret for staging/production." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  {{- range $key := list "POSTGRES_ADMIN_PASSWORD" "AUTH_DATABASE_PASSWORD" "POST_DATABASE_PASSWORD" "CHAT_DATABASE_PASSWORD" "NOTIFICATION_DATABASE_PASSWORD" "REDIS_PASSWORD" "REDIS_ADDR" }}
  {{ $key }}: {{ required (printf "secrets.developmentData.%s is required" $key) (index $.Values.secrets.developmentData $key) | quote }}
  {{- end }}
{{- end }}
