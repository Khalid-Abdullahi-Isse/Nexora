apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-media-staging
  namespace: argocd
spec:
  project: social-media
  source:
    repoURL: https://github.com/Khalid-Abdullahi-Isse/Nexora.git
    targetRevision: main
    path: deployments/helm/social-media-backend
    helm:
      releaseName: social-media
      valueFiles:
      - values-staging.yaml
      parameters:
      - name: deploymentMode
        value: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: social-media-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
